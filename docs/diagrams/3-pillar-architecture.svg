    <text x="20" y="46" class="card-subtitle">src/pears_p2p/mesh.js</text>
    <rect x="250" y="16" width="80" height="20" rx="4" fill="#7C3AED" />
    <text x="256" y="30" class="badge" fill="#FFFFFF">AIR-GAP SYNC</text>

    <!-- Sub-boxes -->
    <g transform="translate(18, 68)">
      <rect width="314" height="74" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">1. Holepunch Pears Swarm</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• Hypercore-compatible peer discovery</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Zero centralized bootstrap/relay servers</text>
    </g>

    <g transform="translate(18, 154)">
      <rect width="314" height="84" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">2. Optical Air-Gap QR Streamer</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• High-density animated SVG QR code streamer</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Streams signed vouchers to air-gapped cameras</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• 100% immune to RF eavesdropping &amp; Wi-Fi snooping</text>
    </g>

    <g transform="translate(18, 250)">
      <rect width="314" height="84" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">3. Acoustic FSK Air-Gap Modem</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• Web Audio API audio frequency-shift keying</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Encodes WDK signatures into acoustic bursts</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• Real-time waveform canvas visualization</text>
    </g>

    <g transform="translate(18, 346)">
      <rect width="314" height="96" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">4. Offline Settlement &amp; Broadcast</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• Micro-payrolls &amp; merchant escrows in disasters</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Synchronizes across mesh nodes without ISP</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• Delayed on-chain broadcast via online relay nodes</text>
      <text x="14" y="90" class="card-body" font-size="11.5">• Verifiable signed cryptographic proof bundles</text>
    </g>
  </g>

  <!-- Bottom System Banner -->
  <g transform="translate(60, 615)">
    <rect width="1080" height="32" rx="6" fill="#0B132B" stroke="#1E293B" />
    <text x="20" y="21" class="badge" fill="#94A3B8">SYSTEM: Windows 11 | 11th Gen Intel(R) Core(TM) i5-1155G7 @ 2.50GHz (4C/8T) | 16 GB RAM | Intel Iris Xe Graphics | Node.js RSS: &lt;50 MB</text>
  </g>
</svg>
