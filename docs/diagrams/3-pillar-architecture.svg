<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.5px; }
    .subtitle { font-family: 'SF Mono', Consolas, monospace; font-size: 13px; fill: #10B981; letter-spacing: 1px; }
    .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 700; }
    .card-subtitle { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; fill: #94A3B8; }
    .badge { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; }
    .card-body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; fill: #CBD5E1; line-height: 1.5; }
    .flow-label { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; fill: #38BDF8; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 65)">
    <circle cx="20" cy="20" r="18" fill="url(#emeraldGrad)" opacity="0.2" />
    <path d="M12 20 L18 26 L28 14" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="16" class="title">AegisMesh QVAC: Sovereign 3-Pillar Architecture</text>
    <text x="50" y="36" class="subtitle">TETHER HACKATHON: "AI YAKO: OWN YOUR AI" | 100% OFFLINE AIR-GAPPED SPECIFICATION</text>
    <rect x="910" y="5" width="190" height="28" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1" />
    <text x="925" y="24" class="badge" fill="#6EE7B7">AIR-GAP: 0.0 KB/s RF EMISSION</text>
  </g>

  <!-- Flow Arrows connecting Pillars -->
  <!-- Pillar 1 -> Pillar 2 -->
  <path d="M 410 320 L 450 320" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="450,315 462,320 450,325" fill="#10B981" />
  <rect x="390" y="275" width="90" height="22" rx="4" fill="#0B132B" stroke="#1E293B" />
  <text x="398" y="290" class="flow-label">VERIFIED (1/2)</text>

  <!-- Pillar 2 -> Pillar 3 -->
  <path d="M 760 320 L 800 320" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="800,315 812,320 800,325" fill="#06B6D4" />
  <rect x="740" y="275" width="90" height="22" rx="4" fill="#0B132B" stroke="#1E293B" />
  <text x="748" y="290" class="flow-label" fill="#06B6D4">DUAL SIGN (2/2)</text>

  <!-- ========================================================================= -->
  <!-- PILLAR 1: QVAC LOCAL NEURAL ENGINE -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 140)">
    <rect width="350" height="460" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8" />
    <rect x="0" y="0" width="350" height="52" rx="12" fill="#064E3B" fill-opacity="0.35" />
    
    <text x="20" y="32" class="card-title" fill="#10B981">PILLAR 1: QVAC NEURAL ENGINE</text>
    <text x="20" y="46" class="card-subtitle">src/qvac_core/engine.js</text>
    <rect x="250" y="16" width="80" height="20" rx="4" fill="#059669" />
    <text x="262" y="30" class="badge" fill="#FFFFFF">LOCAL INT4</text>

    <!-- Sub-boxes -->
    <g transform="translate(18, 68)">
      <rect width="314" height="74" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">1. Multilingual Intent Synthesis</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• English + Swahili ("AI Yako" Native)</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Semantic parser maps prompts to settlement JSON</text>
    </g>

    <g transform="translate(18, 154)">
      <rect width="314" height="84" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">2. Offline EVM Bytecode Disassembler</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• 4-Byte selectors: 0xa9059cbb, 0x095ea7b3, etc.</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• ABI word slicing &amp; address checksumming</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• Zero external web3/RPC dependencies</text>
    </g>

    <g transform="translate(18, 250)">
      <rect width="314" height="84" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">3. Zero-Latency Threat Radar (0-100)</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• 1,400+ offline phishing markers &amp; drainer traps</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Blocks 0x095e...ffff infinite approval sweepers</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• Strict 40/100 threshold for AI co-signing</text>
    </g>

    <g transform="translate(18, 346)">
      <rect width="314" height="96" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">4. Pre-Execution Shadow Sandbox</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• Simulates balance delta: $10,000 -&gt; $8,750 USDt</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Unveils unlimited exposure ($0 -&gt; UNLIMITED)</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• Pre/Post-execution Keccak-256 state roots</text>
      <text x="14" y="90" class="card-body" font-size="11.5">• Hardware: Intel Iris Xe CPU VNNI (19ms TTFT)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PILLAR 2: TETHER WDK AIR-GAPPED VAULT -->
  <!-- ========================================================================= -->
  <g transform="translate(425, 140)">
    <rect width="350" height="460" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-width="1.8" />
    <rect x="0" y="0" width="350" height="52" rx="12" fill="#0891B2" fill-opacity="0.35" />
    
