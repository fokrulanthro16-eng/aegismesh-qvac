      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">2. EIP-712 &amp; secp256k1 Engine</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• Pure Node.js native crypto implementation</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Generates verifiable (v, r, s) ECDSA tuples</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• Zero network exposure during private key signing</text>
    </g>

    <g transform="translate(18, 250)">
      <rect width="314" height="84" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">3. Offline HTLC Settlement Engine</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• SHA-256 Hash Time Locked Contracts</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Timelocked escrow vouchers (24h expiry)</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• Secret pre-image atomic unlocking</text>
    </g>

    <g transform="translate(18, 346)">
