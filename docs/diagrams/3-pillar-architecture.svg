      <text x="14" y="24" font-family="Segoe UI" font-size="13" font-weight="700" fill="#E2E8F0">4. Cryptographic Merkle Audit Log</text>
      <text x="14" y="44" class="card-body" font-size="11.5">• Mathematically binds AI trace to WDK signature</text>
      <text x="14" y="60" class="card-body" font-size="11.5">• Prevents post-audit payload tampering</text>
      <text x="14" y="76" class="card-body" font-size="11.5">• Incremental Keccak-256 Merkle root computation</text>
      <text x="14" y="90" class="card-body" font-size="11.5">• Audit trail exportable to offline JSON proof</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PILLAR 3: PEARS LOCAL P2P MESH -->
  <!-- ========================================================================= -->
  <g transform="translate(790, 140)">
